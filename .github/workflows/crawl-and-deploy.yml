name: Crawl & Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 (UTC)
  workflow_dispatch: # 手動実行トリガー
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run Pipeline (Crawl & Build Static Data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m scholarrepo_finder.pipeline

      - name: Commit updated awesome_scholar_repos.md (if on main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/awesome_scholar_repos.md || true
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: 自動クロールによる awesome_scholar_repos.md の更新"
          git push origin main || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
