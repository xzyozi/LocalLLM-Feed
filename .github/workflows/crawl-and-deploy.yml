# LocalLLM Feed: 収集パイプライン実行 & GitHub Pages デプロイ。
# 毎日1回 GGUF モデルを収集して public/data を生成し、Pages へデプロイする。
# ホワイトリスト外の人気配布者は Issue で通知する（LLF-DD-001 §3.3）。
name: Crawl & Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 21:00 UTC = JST 翌06:00
  workflow_dispatch: # 手動実行トリガー
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "config/**"
      - "pyproject.toml"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system -e "."

      - name: Run pipeline (crawl & build static data)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m localllm_feed.pipeline

      - name: Notify candidate authors via Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'public/data/popular_candidates.json';
            if (!fs.existsSync(path)) {
              core.info('No candidates file; skipping notification.');
              return;
            }
            const candidates = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(candidates) || candidates.length === 0) {
              core.info('No candidate authors detected.');
              return;
            }
            const label = 'gguf-candidate-author';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const existingBodies = existing.data.map(i => i.body || '');
            const fresh = candidates.filter(
              c => !existingBodies.some(b => b.includes(c.author))
            );
            if (fresh.length === 0) {
              core.info('All candidate authors already have open issues.');
              return;
            }
            const lines = fresh.map(
              c => `- **${c.author}** (downloads: ${c.downloads}) 例: [${c.sample_model_id}](https://huggingface.co/${c.sample_model_id})`
            );
            const body = [
              'ホワイトリスト外で人気の高い GGUF 配布者を検出しました。',
              '`config/collection.toml` の `[collection].authors` への追加を検討してください。',
              '',
              ...lines,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `新しいGGUF配布者候補 (${new Date().toISOString().slice(0,10)})`,
              body,
              labels: [label],
            });
            core.info(`Created issue for ${fresh.length} candidate authors.`);

      - name: Commit updated feed data (if on main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/models_feed.json public/data/scoring.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "[other] 自動収集による models_feed.json の更新"
          # push 失敗（コンフリクト・権限等）をワークフローの警告として可視化する。
          # フィードは冪等に再生成されるためジョブ自体は失敗させないが、警告は残す。
          git push origin main || echo "::warning::git push origin main failed; feed data was not pushed"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4