name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Ruff (Linter)
        run: |
          uv run ruff check .

      - name: Run Ruff (Formatter Check)
        run: |
          uv run ruff format --check .

      - name: Run Mypy (Type Check)
        run: |
          uv run mypy .

      - name: Run Pytest
        run: |
          uv run pytest

  mermaid:
    name: Validate Mermaid diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@11

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Validate Mermaid blocks in Markdown
        run: |
          set -e
          shopt -s globstar nullglob
          status=0
          mkdir -p .mermaid-check
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > .mermaid-check/puppeteer-config.json
          for md in docs/**/*.md; do
            if grep -q '```mermaid' "$md"; then
              echo "Checking Mermaid in: $md"
              if ! mmdc -i "$md" -o ".mermaid-check/out.md" -q -p ".mermaid-check/puppeteer-config.json"; then
                echo "::error file=$md::Mermaid parse error detected"
                status=1
              fi
            fi
          done
          rm -rf .mermaid-check
          exit $status
