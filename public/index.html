<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarRepo-Finder 🔍📚 | 学術研究・アルゴリズム検証用OSS特化型検索</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MiniSearch CDN -->
  <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.1/dist/umd/index.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20">
          🔍
        </div>
        <div>
          <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-purple-300 bg-clip-text text-transparent">ScholarRepo-Finder</h1>
          <p id="headerSubtitle" class="text-xs text-slate-400">学術研究・アルゴリズム検証用OSS特化型 探索エンジン</p>
        </div>
      </div>
      <div class="flex items-center space-x-2.5 sm:space-x-3">
        <!-- Language Switcher -->
        <button id="langToggleBtn" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-indigo-300 transition">
          <span id="langFlag">🌐</span>
          <span id="langLabel">English</span>
        </button>

        <button id="exportMdBtn" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition shadow-sm shadow-indigo-500/20">
          <span id="exportMdBtnText">📥 Markdown一括保存</span>
        </button>
        <a href="https://github.com/xzyozi/ScholarRepo-Finder" target="_blank" rel="noopener noreferrer" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition" title="GitHub Repository">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full flex flex-col md:flex-row gap-8">
    
    <!-- Sidebar: Filters -->
    <aside class="w-full md:w-72 flex-shrink-0 space-y-6">
      
      <!-- Search Input -->
      <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-800 space-y-3">
        <label id="lblSearch" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">キーワード検索</label>
        <div class="relative">
          <input type="text" id="searchInput" placeholder="例: routing, simpy, vrp..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>

      <!-- Facet Filters -->
      <div class="bg-slate-800/60 p-5 rounded-2xl border border-slate-800 space-y-5">
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
          <h2 id="lblFilterTitle" class="text-sm font-bold text-slate-200">絞り込みフィルター</h2>
          <button id="resetFiltersBtn" class="text-xs text-indigo-400 hover:text-indigo-300 transition">リセット</button>
        </div>

        <!-- Language Filter -->
        <div class="space-y-2">
          <label id="lblLang" class="text-xs font-medium text-slate-400">主要言語</label>
          <select id="langSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="" id="optAllLang">すべての言語</option>
          </select>
        </div>

        <!-- Minimum Score Slider -->
        <div class="space-y-2">
          <div class="flex justify-between items-center text-xs font-medium text-slate-400">
            <span id="lblMinScore">最低総合スコア</span>
            <span id="scoreVal" class="text-indigo-400 font-bold">60.0 点</span>
          </div>
          <input type="range" id="scoreRange" min="50" max="120" step="5" value="60" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <!-- Checkboxes -->
        <div class="space-y-3 pt-2">
          <label class="flex items-center space-x-2.5 cursor-pointer text-sm text-slate-300 hover:text-white">
            <input type="checkbox" id="paperCheck" class="w-4 h-4 rounded text-indigo-600 bg-slate-900 border-slate-700 focus:ring-indigo-500">
            <span id="lblPaperCheck">📄 論文リンク (DOI / arXiv) 必須</span>
          </label>
          <label class="flex items-center space-x-2.5 cursor-pointer text-sm text-slate-300 hover:text-white">
            <input type="checkbox" id="eduCheck" class="w-4 h-4 rounded text-indigo-600 bg-slate-900 border-slate-700 focus:ring-indigo-500">
            <span id="lblEduCheck">🎓 研究・教育機関 (.edu/.ac) のみ</span>
          </label>
        </div>

      </div>

      <!-- Quick Metrics -->
      <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-800/80 text-xs text-slate-400 space-y-1.5">
        <div class="flex justify-between">
          <span id="lblTotalRepo">登録OSS総数:</span>
          <span id="totalRepoCount" class="font-bold text-slate-200">0 件</span>
        </div>
        <div class="flex justify-between">
          <span id="lblDisplaying">表示中:</span>
          <span id="filteredRepoCount" class="font-bold text-indigo-400">0 件</span>
        </div>
      </div>

    </aside>

    <!-- Content Area -->
    <section class="flex-1 flex flex-col space-y-4 min-w-0">
      
      <!-- Sort & Status Header -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-800/30 p-3.5 rounded-2xl border border-slate-800">
        <div class="text-xs text-slate-400">
          <span id="lblResultsPrefix">検索結果:</span> <span id="resultCountLabel" class="font-bold text-slate-200 text-sm">0</span> <span id="lblResultsSuffix">件の優良学術OSS</span>
        </div>
        <div class="flex items-center space-x-2 text-xs">
          <span id="lblSortBy" class="text-slate-400">並び替え:</span>
          <select id="sortSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option value="score_desc" id="optSortScore">総合スコア順 (高→低)</option>
            <option value="stars_desc" id="optSortStars">スター数順</option>
            <option value="updated_desc" id="optSortUpdated">最終更新日順</option>
          </select>
        </div>
      </div>

      <!-- Repo Cards Grid -->
      <div id="repoList" class="space-y-4">
        <!-- Cards injected dynamically via app.js -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden py-16 text-center space-y-3 bg-slate-800/20 rounded-2xl border border-dashed border-slate-800">
        <div class="text-4xl">🔬</div>
        <p id="lblEmptyTitle" class="text-base font-semibold text-slate-300">該当するリポジトリが見つかりませんでした</p>
        <p id="lblEmptySubtitle" class="text-xs text-slate-500">検索条件や最低スコアを緩めてお試しください。</p>
      </div>

    </section>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-xl flex items-center space-x-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
    <span>📋</span>
    <span id="toastMsg">Markdown引用をコピーしました</span>
  </div>

  <script src="./app.js"></script>
</body>
</html>
