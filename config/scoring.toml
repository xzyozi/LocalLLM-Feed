# ScholarRepo-Finder の既定スコアプロファイル。
# 配点の変更理由は値の近くに記録し、profile.version も更新する。
schema_version = 1
indexing_threshold = 60.0 # 掲載判定はこの値以上

[profile]
id = "reusability-v1"
version = 1

[hard_filters]
max_inactive_years = 5 # 長期未更新の候補を除外する
min_readme_char_length = 100 # 最低限の利用説明を要求する

[scores.reusability]
maximum = 30.0 # 評価の中心は再利用性

[scores.reusability.delivery_form]
library = 12.0 # 他プログラムから直接利用できる
modular_application = 8.0 # 再利用可能なモジュールを確認できる
executable_application = 2.0 # 除外せず、優先度の差として扱う
unknown = 0.0 # 根拠不足では加点しない

[scores.reusability.public_api_evidence]
per_item = 4.0
maximum = 8.0

[scores.reusability.module_partition_evidence]
per_item = 2.5
maximum = 5.0

[scores.reusability.usage_evidence]
per_item = 1.0
maximum = 3.0

[scores.reusability.configurable_io_evidence]
per_item = 1.0
maximum = 2.0

[scores.maintainability]
maximum = 20.0 # 構成の明瞭さと継続的検証を評価する
ci_workflow = 10.0

[scores.maintainability.directory_count]
"1" = 4.0
"2" = 7.0
"3" = 10.0

[scores.research_context]
maximum = 50.0 # 論文・検証文脈を補助的に評価する
paper_link = 35.0

[scores.research_context.academic_keyword]
per_item = 1.5
maximum = 15.0

[scores.trust_multiplier]
academic_domain = 1.5 # 教育・研究機関ドメインを優先する
verified_organization = 1.3
account_age_years = 3
experienced_account = 1.1
default = 1.0
