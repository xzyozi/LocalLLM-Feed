# LocalLLM Feed スコアリング設定（フロントが動的スコア計算に使用）。
# 数値の正本は docs/design/LLF-SC-001。変更時は profile.version を更新する。
# ビルド時に public/data/scoring.json へ変換して配信する。
schema_version = 1

[profile]
id = "gguf-feed-v1"
version = 1

# ユーザー VRAM 区分（GB）ごとの、モデルパラメータ帯への加点/減点。
# param_tiers で <=3B, <=8B, <=14B, <=24B, <=35B に区分する。
[vram_match]
param_tiers = [3, 8, 14, 24, 35]

[vram_match.gb8]   # VRAM 8GB
scores = [8, 10, 4, -6, -12]
[vram_match.gb12]  # VRAM 12GB
scores = [4, 10, 10, -2, -8]
[vram_match.gb16]  # VRAM 16GB
scores = [2, 8, 10, 6, -4]
[vram_match.gb24]  # VRAM 24GB
scores = [0, 4, 8, 10, 6]
[vram_match.gb32]  # VRAM 32GB+
scores = [0, 2, 6, 10, 10]

[quantization]
# quants に含まれる場合の一律加点
sweet_spot = ["Q4_K_M", "Q5_K_M"]  # 実用性の高い定番
sweet_spot_bonus = 6.0
# 特大 VRAM（32GB+）でのみ無劣化寄りフォーマットを優遇
high_fidelity = ["Q8_0", "Q6_K"]
high_fidelity_bonus = 5.0
high_fidelity_min_vram_gb = 32

[efficiency]
# is_distilled かつ 優先度=speed のときの加点
distilled_speed_bonus = 5.0

[offload]
# n_gpu_layers 初期値算出のための係数（LLF-SC-001 §4）
safety_margin = 0.9        # 使用可能 VRAM に掛ける安全係数
os_reserved_gb = 1.0       # OS/その他が使う VRAM の控除
kv_cache_gb = 1.5          # KV キャッシュ等の追加控除の目安
bytes_per_param_q4 = 0.5   # Q4 系: 約 0.5 GB/B（概算）
default_layers_35b = 40    # 35B 級の代表レイヤー数（total_layers 推定の既定）